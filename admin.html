<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="과학구리"/>
<meta name="theme-color" content="#061442"/>
<style>html{visibility:hidden}</style>
<title>관리자 정보 — 과학구리</title>
<style>
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:32px;}
.admin-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:26px;
  position:relative;overflow:hidden;
}
.admin-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--yellow),rgba(255,236,0,.3));
}
.admin-avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--yellow),rgba(255,236,0,.4));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:var(--navy2);
  margin-bottom:14px;
}
.admin-name{font-size:18px;font-weight:800;color:var(--navy2);margin-bottom:4px;}
.admin-role{
  font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;
  display:inline-block;padding:3px 10px;border-radius:20px;
  background:#eef1f8;color:var(--navy);
  margin-bottom:14px;
}
.admin-role.teacher{background:#fde3e3;color:#b3432b;}
.admin-contact{
  font-size:14px;color:var(--muted);
  display:flex;flex-direction:column;gap:6px;
}
.admin-contact a{color:var(--navy);font-weight:600;text-decoration:none;}
.admin-contact a:hover{text-decoration:underline;}

.admin-notice{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 28px;
  font-size:15px;line-height:1.8;color:var(--muted);
}
.admin-notice strong{color:var(--ink);}
.admin-notice ul{padding-left:20px;margin-top:10px;}
.admin-notice li{margin-bottom:6px;}
</style>
</head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-N97N23PF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<body>
<div class="bw-page">
  <h1 class="bw-page-title">👤 관리자 정보</h1>
  <p class="bw-page-sub">문의, 오류 제보, 기능 추가 제안은 게시판에 게시글로 남겨주세요.</p>

  <div class="admin-grid">
    <div class="admin-card">
      <div class="admin-avatar">J</div>
      <div class="admin-name">Jvnxyk</div>
      <div class="admin-role">개인 관리자</div>
      <div class="admin-contact">
        <span style="font-size:13px;">앱 제작 · 개발 · 게시판 관리</span>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-avatar">N</div>
      <div class="admin-name">부관리자</div>
      <div class="admin-role">개인 관리자</div>
      <div class="admin-contact">
        <span style="font-size:13px;">콘텐츠 관리 · 정보 업데이트</span>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-avatar">T</div>
      <div class="admin-name">교사 계정</div>
      <div class="admin-role teacher">T</div>
      <div class="admin-contact">
        <span style="font-size:13px;">최고 권한</span>
      </div>
    </div>
  </div>

  <div class="admin-notice">
    <strong>문의 및 제안 안내</strong>
    <ul>
      <li>문의, 오류 제보, 게시글 신고, 기능 추가 제안은 <a href="board.html">게시판</a>에 글을 남겨주세요.</li>
      <li>게시판 권한이나 콘텐츠 수정 요청도 게시글로 알려주세요.</li>
      <li>비밀번호, 인증 정보, 그 밖의 개인정보는 게시글에 올리지 마세요.</li>
    </ul>
  </div>
</div>
<script src="config.js"></script>
<script src="native-bridge.js"></script>
<script src="common.js"></script>
</body>
</html>
