workflows:
  # ── Android 빌드 ──────────────────────────────────────────────
  # 무료 개인 플랜은 macOS M2 인스턴스만 빌드 분(월 500분)이 무료입니다.
  # (linux/windows 인스턴스는 무료 플랜에서 과금 대상이라 사용할 수 없습니다)
  # macOS 머신 위에서도 Android SDK/Gradle이 기본 설치되어 있어 정상 빌드됩니다.
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
    scripts:
      - name: 빌드 준비 (설치 → cap add → 아이콘 → sync)
        script: |
          set -e
          echo "── 현재 위치 및 package.json 확인 ──"
          pwd
          cat package.json | head -5

          echo "── 캐시된 node_modules 강제 삭제 ──"
          rm -rf node_modules package-lock.json

          echo "── npm install 실행 (캐시 무시) ──"
          npm install --include=dev --no-cache --prefer-online

          echo "── 설치 결과 확인 ──"
          ls node_modules | wc -l
          test -d node_modules/.bin || (echo "node_modules/.bin 없음 - 설치 실패" && exit 1)

          # npx가 실행파일을 못 찾는 문제를 피하기 위해
          # node_modules/.bin 의 실제 경로를 PATH 맨 앞에 추가합니다.
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          which cap
          cap --version

          if [ ! -d "android" ]; then
            cap add android
          fi

          echo "── FCM(google-services.json) 연결 ──"
          test -f google-services.json || (echo "google-services.json이 프로젝트 루트에 없습니다!" && exit 1)
          cp google-services.json android/app/google-services.json
          # 최신 Capacitor 템플릿은 android/build.gradle에 google-services 클래스패스가,
          # android/app/build.gradle에는 google-services.json이 있으면 자동으로 플러그인을
          # 적용하는 코드가 이미 포함되어 있어, 파일 복사만으로 연결됩니다.

          echo "── 아이콘 소스 확인 ──"
          ls -la resources/ || echo "resources 폴더 없음!"

          capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#061442' --iconBackgroundColorDark '#061442' --splashBackgroundColor '#061442' --splashBackgroundColorDark '#061442'

          echo "── 생성된 아이콘 확인 ──"
          find android/app/src/main/res -iname "*launcher*" | head -20

          cap sync android
      - name: Android 앱(.apk) 빌드
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  # ── iOS 빌드 (서명 + TestFlight 배포까지) ────────────────────────
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic 콘솔 > Team settings > Integrations 에서
      # App Store Connect API 키를 등록한 뒤, 여기에 그 이름을 넣으세요.
      # (등록할 때 붙인 이름 그대로 적으면 됩니다. 예: "jshs-app-key")
      app_store_connect: jshs-app-key
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        # capacitor.config.json 의 appId 와 반드시 동일해야 합니다.
        bundle_identifier: kr.jshs.bestwing13
      vars:
        BUNDLE_ID: "kr.jshs.bestwing13"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: 빌드 준비 (설치 → cap add → 아이콘 → sync)
        script: |
          set -e
          echo "── 현재 위치 및 package.json 확인 ──"
          pwd
          cat package.json | head -5

          echo "── 캐시된 node_modules 강제 삭제 ──"
          rm -rf node_modules package-lock.json

          echo "── npm install 실행 (캐시 무시) ──"
          npm install --include=dev --no-cache --prefer-online

          echo "── 설치 결과 확인 ──"
          ls node_modules | wc -l
          test -d node_modules/.bin || (echo "node_modules/.bin 없음 - 설치 실패" && exit 1)

          export PATH="$(pwd)/node_modules/.bin:$PATH"
          which cap
          cap --version

          if [ ! -d "ios" ]; then
            cap add ios
          fi

          capacitor-assets generate --ios --assetPath resources --iconBackgroundColor '#061442' --iconBackgroundColorDark '#061442' --splashBackgroundColor '#061442' --splashBackgroundColorDark '#061442'

          cap sync ios
      - name: CocoaPods 설치
        script: |
          cd ios/App && pod install
      - name: 코드 서명 설정 가져오기
        script: |
          # App Store Connect API 키로 인증서/프로비저닝 프로파일을 자동 발급받습니다.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Xcode 아카이브 빌드 (.xcarchive)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 심사까지 자동 제출하려면 아래 주석을 해제하세요 (처음엔 TestFlight만 권장).
        # submit_to_app_store: true

