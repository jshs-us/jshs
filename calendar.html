<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<!-- PWA / iOS 홈 화면 추가 지원 -->
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="과학구리"/>
<meta name="theme-color" content="#061442"/>
<style>html{visibility:hidden}</style>
<title>학사일정 — 과학구리</title>
<style>
.cal-nav{
  display:flex;align-items:center;justify-content:center;gap:18px;
  margin-bottom:16px;
}
.cal-arrow{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:#fff;
  color:var(--navy2);font-size:16px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.14s;flex:0 0 auto;
}
.cal-arrow:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.cal-arrow:disabled{opacity:.35;cursor:default;background:#fff;color:var(--navy2);border-color:var(--line);}
.cal-current{
  font-size:22px;font-weight:900;color:var(--navy2);
  letter-spacing:-.02em;min-width:70px;text-align:center;
}

.cal-tabs{
  display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;
  overflow-x:auto;padding-bottom:2px;justify-content:center;
}
.cal-tab{
  font-family:var(--ff);
  border:1px solid var(--line);background:#fff;
  color:var(--muted);font-size:13px;font-weight:600;
  padding:6px 14px;border-radius:20px;cursor:pointer;
  transition:.14s;flex:0 0 auto;
}
.cal-tab:hover,.cal-tab.active{
  background:var(--navy);color:#fff;border-color:var(--navy);
}

.cal-wrap{overflow-x:auto;}
table.cal-table{
  width:100%;border-collapse:collapse;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  overflow:hidden;
  font-size:14px;
  min-width:380px;
}
.cal-table th{
  background:var(--navy2);color:#fff;
  font-size:13px;font-weight:700;
  padding:12px 10px;text-align:center;
  white-space:nowrap;
}
.cal-table td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
.cal-table tr:last-child td{border-bottom:none;}
.cal-table td.cal-date{
  text-align:center;font-weight:800;font-size:15px;
  width:44px;color:var(--ink);
}
.cal-table td.cal-wd{
  text-align:center;font-weight:600;font-size:12.5px;
  width:34px;color:var(--muted);
}
.cal-table td.cal-event{font-size:14px;}
.cal-table tr.is-sun td.cal-date,.cal-table tr.is-sun td.cal-wd{color:#d64545;}
.cal-table tr.is-sat td.cal-date,.cal-table tr.is-sat td.cal-wd{color:#2f5fa8;}

.cal-loading,.cal-empty{text-align:center;padding:60px 0;color:var(--muted);}
.cal-empty{font-size:15px;}
</style>
</head>
<body>
<div class="bw-page">
  <h1 class="bw-page-title"><span id="bw-egg-cal-trigger" style="cursor:default;">🗓</span> 학사일정</h1>
  <p class="bw-page-sub" id="cal-sub">스프레드시트에서 실시간으로 불러옵니다.</p>

  <div class="cal-nav">
    <button class="cal-arrow" id="cal-prev" aria-label="이전 달">‹</button>
    <span class="cal-current" id="cal-current">5월</span>
    <button class="cal-arrow" id="cal-next" aria-label="다음 달">›</button>
  </div>

  <nav class="cal-tabs" id="cal-tabs"></nav>

  <div class="cal-wrap">
    <div id="cal-body"><div class="cal-loading">불러오는 중...</div></div>
  </div>

  <p style="margin-top:20px;font-size:13px;color:var(--muted);">
    ※ 학사일정 수정은
    <a href="https://docs.google.com/spreadsheets/d/1WpQv3cKHgUuBdTWff_OOuhTtgkX2EhLH4eET9ZLOs8Q/edit?gid=879697319" target="_blank"
       style="color:var(--navy);font-weight:700;">스프레드시트</a>에서 직접 해주세요.
  </p>
</div>

<script src="config.js"></script>
<script src="native-bridge.js"></script>
<script src="common.js"></script>
<script>
const SHEET_ID = "1WpQv3cKHgUuBdTWff_OOuhTtgkX2EhLH4eET9ZLOs8Q";
const GID = "879697319"; // "Test" 탭
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

const MONTHS = [
  {label:"5월"},{label:"6월"},{label:"7월"},{label:"8월"},{label:"9월"},
  {label:"10월"},{label:"11월"},{label:"12월"},{label:"1월"},{label:"2월"}
];
// A,B,C=5월 / D,E,F=6월 ... 3열씩, 1행=1일부터 시작
MONTHS.forEach((m,i)=>{ m.startCol = i*3; }); // 0-indexed

const LIST_ROWS = 31;

let current = 0;

function esc(s){ const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML; }

function buildMonthData(rows){
  MONTHS.forEach(m=>{
    const dateIdx=m.startCol, wdIdx=m.startCol+1, evIdx=m.startCol+2;
    const days=[];
    for(let d=1; d<=LIST_ROWS; d++){
      const r=rows[d-1];
      if(!r) break;
      const cell = r.c || [];
      const dv = cell[dateIdx]?.v ?? "";
      if(parseInt(dv,10)!==d) break;
      days.push({
        date:d,
        weekday:(cell[wdIdx]?.v ?? "").toString().trim(),
        event:(cell[evIdx]?.v ?? "").toString().trim()
      });
    }
    m.days=days;
  });
}

function renderTabs(){
  const el=document.getElementById("cal-tabs");
  el.innerHTML="";
  MONTHS.forEach((m,i)=>{
    const b=document.createElement("button");
    b.className="cal-tab"+(i===current?" active":"");
    b.textContent=m.label;
    b.addEventListener("click",()=>{ current=i; render(); });
    el.appendChild(b);
  });
}

function render(){
  const m = MONTHS[current];
  document.getElementById("cal-current").textContent = m.label;
  document.getElementById("cal-prev").disabled = current===0;
  document.getElementById("cal-next").disabled = current===MONTHS.length-1;
  renderTabs();

  const items = (m.days||[]).filter(d=>d.event);
  const body = document.getElementById("cal-body");

  if(!items.length){
    body.innerHTML = `<div class="cal-empty">${m.label}에 등록된 일정이 없어요.</div>`;
    return;
  }

  const rowsHtml = items.map(d=>{
    const cls = d.weekday==="일" ? "is-sun" : d.weekday==="토" ? "is-sat" : "";
    return `<tr class="${cls}">
      <td class="cal-date">${d.date}</td>
      <td class="cal-wd">${esc(d.weekday)}</td>
      <td class="cal-event">${esc(d.event)}</td>
    </tr>`;
  }).join("");

  body.innerHTML = `
    <table class="cal-table">
      <thead><tr><th>일</th><th>요일</th><th>일정</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

document.getElementById("cal-prev").addEventListener("click",()=>{
  if(current>0){ current--; render(); }
});
document.getElementById("cal-next").addEventListener("click",()=>{
  if(current<MONTHS.length-1){ current++; render(); }
});

fetch(URL)
  .then(r=>r.text())
  .then(raw=>{
    const json = JSON.parse(raw.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
    buildMonthData(json.table.rows);
    document.getElementById("cal-sub").textContent = "원하는 달을 누르거나 화살표로 이동해보세요.";
    render();
  })
  .catch(err=>{
    console.error(err);
    document.getElementById("cal-body").innerHTML =
      `<div class="cal-empty">스프레드시트를 불러오지 못했어요.<br>공유 설정을 확인해주세요.</div>`;
  });

// ============================================================
// 🥚 이스터에그: 요일 맞추기 — 🗓 아이콘을 3초 안에 3번 탭하면 시작
// ============================================================
(function () {
  const NEEDED = 3, TAP_WINDOW = 3000, ROUNDS = 8;
  let tapCount = 0, resetTimer = null;

  document.addEventListener('click', (e) => {
    const t = e.target.closest('#bw-egg-cal-trigger');
    if (!t) return;
    tapCount++;
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { tapCount = 0; }, TAP_WINDOW);
    if (tapCount >= NEEDED) {
      tapCount = 0;
      if (window.BwEgg) window.BwEgg.revealThen('요일 맞추기 발견!', startGame);
    }
  });

  function ensureStyle() {
    if (document.getElementById('bw-egg-cal-style')) return;
    const s = document.createElement('style');
    s.id = 'bw-egg-cal-style';
    s.textContent = `
      #bw-egg-cal{position:fixed;inset:0;z-index:999999;background:#040d29;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:24px;animation:bwCalFade .2s ease;}
      @keyframes bwCalFade{from{opacity:0}to{opacity:1}}
      .bw-egg-cal-card{background:linear-gradient(180deg,#0d2358,#0a1c47);
        border:1px solid rgba(255,255,255,.08);border-radius:20px;
        padding:26px 22px;width:100%;max-width:320px;text-align:center;
        box-shadow:0 12px 40px rgba(0,0,0,.45);position:relative;}
      .bw-egg-cal-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.1);
        border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;}
      .bw-egg-cal-progress{color:rgba(255,255,255,.5);font-size:12px;font-weight:700;margin-bottom:6px;}
      .bw-egg-cal-q{color:#fff;font-size:19px;font-weight:800;margin:10px 0 18px;line-height:1.4;}
      .bw-egg-cal-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
      .bw-egg-cal-opt{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
        color:#fff;border-radius:12px;padding:13px 8px;font-weight:800;font-size:15px;
        cursor:pointer;transition:transform .08s;}
      .bw-egg-cal-opt:active{transform:scale(.95);}
      .bw-egg-cal-opt.correct{background:rgba(46,204,113,.3);border-color:#2ecc71;}
      .bw-egg-cal-opt.wrong{background:rgba(255,45,45,.3);border-color:#ff2d2d;}
      .bw-egg-cal-score{font-size:40px;font-weight:900;color:#ffec00;margin:8px 0;}
      .bw-egg-cal-btnrow{display:flex;gap:8px;margin-top:14px;}
      .bw-egg-cal-btn{border:none;border-radius:12px;padding:11px 16px;font-weight:800;
        font-size:13.5px;cursor:pointer;flex:1;}
      .bw-egg-cal-btn.primary{background:linear-gradient(180deg,#ffec00,#ffd400);color:#061442;}
      .bw-egg-cal-btn.ghost{background:rgba(255,255,255,.08);color:#fff;}
    `;
    document.head.appendChild(s);
  }

  const DOW = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  function randomQuestion() {
    // 조금 엉뚱한 재미를 위해 연도 범위를 넓게 잡음 (과거~아주 먼 미래)
    const year = 1950 + Math.floor(Math.random() * 500); // 1950 ~ 2449
    const month = 1 + Math.floor(Math.random() * 12);
    const day = 1 + Math.floor(Math.random() * 28); // 월말 예외 없이 안전하게
    const d = new Date(year, month - 1, day);
    const answer = DOW[d.getDay()];
    const opts = new Set([answer]);
    while (opts.size < 4) opts.add(DOW[Math.floor(Math.random() * 7)]);
    const shuffled = [...opts].sort(() => Math.random() - 0.5);
    return { year, month, day, answer, opts: shuffled };
  }

  function startGame() {
    if (document.getElementById('bw-egg-cal')) return;
    ensureStyle();
    let round = 0, score = 0, q = null, answering = true;

    const box = document.createElement('div');
    box.id = 'bw-egg-cal';
    document.body.appendChild(box);

    function renderQuestion() {
      round++;
      q = randomQuestion();
      answering = true;
      box.innerHTML = `
        <div class="bw-egg-cal-card">
          <button class="bw-egg-cal-close" type="button" aria-label="닫기">✕</button>
          <div class="bw-egg-cal-progress">${round} / ${ROUNDS}문제 · 맞힌 개수 ${score}개</div>
          <div class="bw-egg-cal-q">${q.year}년 ${q.month}월 ${q.day}일은<br>무슨 요일일까요?</div>
          <div class="bw-egg-cal-opts">
            ${q.opts.map(o => `<button class="bw-egg-cal-opt" data-v="${o}">${o}</button>`).join('')}
          </div>
        </div>
      `;
      box.querySelector('.bw-egg-cal-close').addEventListener('click', () => box.remove());
      box.querySelectorAll('.bw-egg-cal-opt').forEach(btn => {
        btn.addEventListener('click', () => onAnswer(btn.dataset.v, btn));
      });
    }

    function onAnswer(value, btnEl) {
      if (!answering) return;
      answering = false;
      const correct = value === q.answer;
      if (correct) { score++; btnEl.classList.add('correct'); }
      else {
        btnEl.classList.add('wrong');
        box.querySelectorAll('.bw-egg-cal-opt').forEach(b => {
          if (b.dataset.v === q.answer) b.classList.add('correct');
        });
      }
      setTimeout(() => {
        if (round >= ROUNDS) renderResult();
        else renderQuestion();
      }, 700);
    }

    function renderResult() {
      box.innerHTML = `
        <div class="bw-egg-cal-card">
          <div class="bw-egg-cal-progress">🗓 요일 맞추기 결과</div>
          <div class="bw-egg-cal-score">${score} / ${ROUNDS}</div>
          <div class="bw-egg-cal-btnrow">
            <button class="bw-egg-cal-btn primary" id="bw-egg-cal-retry">다시 하기</button>
            <button class="bw-egg-cal-btn ghost" id="bw-egg-cal-done">닫기</button>
          </div>
        </div>
      `;
      box.querySelector('#bw-egg-cal-retry').addEventListener('click', () => { box.remove(); startGame(); });
      box.querySelector('#bw-egg-cal-done').addEventListener('click', () => box.remove());
      if (window.BwEgg) window.BwEgg.submitScore('calendar', score);
    }

    renderQuestion();
  }
})();
</script>
</body>
</html>
