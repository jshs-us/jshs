<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<!-- PWA / iOS 홈 화면 추가 지원 -->
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="과학구리"/>
<meta name="theme-color" content="#061442"/>
<style>html{visibility:hidden}</style>
<title>마이페이지 — 과학구리</title>
<style>
.mp-panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:28px;margin-bottom:16px;
}
.mp-panel-title{font-size:18px;font-weight:800;margin:0 0 18px;color:var(--navy2);}
.mp-profile{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.mp-profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:#eef1f8;border:1px solid var(--line);}
.mp-profile-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mp-profile-hint{font-size:13px;color:var(--muted);margin-top:8px;}
.mp-info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;}
.mp-info-row:last-child{border-bottom:none;}
.mp-student-id-form{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.mp-student-id-form .mp-row{flex:1;min-width:220px;margin:0;}
.mp-student-id-hint{font-size:12px;color:var(--muted);margin-top:8px;}
.mp-info-row span:first-child{color:var(--muted);}
.mp-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:700;}
.mp-badge-admin{background:#fde3e3;color:#b3432b;}
.mp-badge-manager{background:#e3edfd;color:#1a56b3;}
.mp-badge-user{background:#eef1f8;color:var(--muted);}
.mp-badge-muted{background:#f3e3fd;color:#7b2fb3;margin-left:6px;}
.mp-row{margin-bottom:14px;}
.mp-row input{
  font-family:var(--ff);width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:13px 15px;font-size:15px;background:#fbfcfe;color:var(--ink);
}
.mp-row input:focus{outline:none;border-color:var(--navy);background:#fff;}
.mp-btn{
  font-family:var(--ff);cursor:pointer;border:none;border-radius:10px;
  padding:12px 22px;font-size:14.5px;font-weight:700;
  background:var(--yellow);color:var(--navy2);transition:.15s;
}
.mp-btn:hover{filter:brightness(.96);}
.mp-btn:disabled{opacity:.6;cursor:default;}
.mp-msg{font-size:14px;margin-top:12px;min-height:18px;}
.mp-msg.err{color:#c23b3b;}
.mp-msg.ok{color:#1f8a5c;}
.mp-loading,.mp-empty{text-align:center;padding:40px 0;color:var(--muted);}

.mp-ghost-btn{
  font-family:var(--ff);cursor:pointer;border-radius:8px;padding:6px 10px;
  font-size:12.5px;font-weight:600;background:#fff;color:var(--ink);
  border:1px solid var(--line);
}
.mp-ghost-btn:hover{border-color:var(--navy);}
.mp-danger-btn{color:#c23b3b!important;border-color:#f0c8c8!important;}
</style>
</head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-N97N23PF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<body>
<div class="bw-page">
  <h1 class="bw-page-title">👤 마이페이지</h1>
  <p class="bw-page-sub">프로필과 학번을 관리하고 계정 정보를 확인할 수 있어요.</p>

  <div class="mp-panel">
    <p class="mp-panel-title">프로필 사진</p>
    <div class="mp-profile">
      <img class="mp-profile-avatar" id="mp-profile-preview" src="logo.png" alt="프로필 사진 미리보기"/>
      <div>
        <div class="mp-profile-actions">
          <input id="mp-profile-file" type="file" accept="image/*" hidden/>
          <button class="mp-btn" id="mp-profile-select" type="button">사진 선택</button>
          <button class="mp-btn" id="mp-profile-save" type="button" disabled>프로필 저장</button>
          <button class="mp-ghost-btn mp-danger-btn" id="mp-profile-remove" type="button" style="display:none">사진 삭제</button>
        </div>
        <p class="mp-profile-hint" id="mp-profile-msg">이미지 파일, 5MB 이하</p>
      </div>
    </div>
  </div>

  <div class="mp-panel">
    <p class="mp-panel-title">내 정보</p>
    <div id="mp-info"><div class="mp-loading">불러오는 중...</div></div>
  </div>

  <div class="mp-panel" id="mp-student-id-panel" hidden>
    <p class="mp-panel-title">학번 등록 / 변경</p>
    <form id="mp-student-id-form">
      <div class="mp-student-id-form">
        <div class="mp-row"><input id="mp-student-id" type="text" inputmode="numeric" maxlength="11" pattern="[0-9]{4}-[1-3]-[1-4]-[0-9]{2}" placeholder="2026-1-2-03" required aria-label="학번"/></div>
        <button class="mp-btn" id="mp-student-id-save" type="submit">학번 등록</button>
      </div>
      <p class="mp-student-id-hint">입학연도-학년-반-두 자리 번호 형식으로 입력하세요. 학번은 회원끼리 중복될 수 없습니다.</p>
      <p class="mp-msg" id="mp-student-id-msg" aria-live="polite"></p>
    </form>
  </div>

  <div class="mp-panel">
    <p class="mp-panel-title">이메일</p>
    <div class="mp-row"><input id="mp-em" type="email" placeholder="새 이메일 주소" autocomplete="email"/></div>
    <div class="mp-row" id="mp-code-row" style="display:none"><input id="mp-ec" type="text" inputmode="numeric" maxlength="6" placeholder="메일로 받은 인증번호 6자리"/></div>
    <button class="mp-btn" id="mp-send">인증번호 받기</button>
    <button class="mp-btn" id="mp-save" style="display:none">이메일 변경하기</button>
    <div class="mp-msg" id="mp-emsg"></div>
  </div>

  <div class="mp-panel">
    <p class="mp-panel-title">비밀번호 변경</p>
    <div class="mp-row"><input id="mp-op" type="password" placeholder="현재 비밀번호" autocomplete="current-password"/></div>
    <div class="mp-row"><input id="mp-np" type="password" placeholder="새 비밀번호" autocomplete="new-password"/></div>
    <button class="mp-btn" id="mp-cpb">변경하기</button>
    <div class="mp-msg" id="mp-cpm"></div>
  </div>

</div>

<script src="config.js"></script>
<script src="native-bridge.js"></script>
<script src="common.js"></script>
<script>
(function(){
  function escH(s){ const d=document.createElement('div'); d.textContent=String(s??''); return d.innerHTML; }
  function escAttr(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  const session = window.GwakuriAuth && window.GwakuriAuth.getSession();
  if(!session){
    // common.js가 로그인 게이트를 이미 띄우고 있으므로 여기서는 더 진행하지 않음
    return;
  }

  const infoBox = document.getElementById('mp-info');
  const studentIdPanel = document.getElementById('mp-student-id-panel');
  const studentIdForm = document.getElementById('mp-student-id-form');
  const studentIdInput = document.getElementById('mp-student-id');
  const studentIdSave = document.getElementById('mp-student-id-save');
  const studentIdMsg = document.getElementById('mp-student-id-msg');
  const cpb = document.getElementById('mp-cpb');
  const cpm = document.getElementById('mp-cpm');
  const opEl = document.getElementById('mp-op');
  const npEl = document.getElementById('mp-np');
  const profilePreview = document.getElementById('mp-profile-preview');
  const profileFile = document.getElementById('mp-profile-file');
  const profileSave = document.getElementById('mp-profile-save');
  const profileRemove = document.getElementById('mp-profile-remove');
  const profileMsg = document.getElementById('mp-profile-msg');
  let selectedProfileFile = null;
  let selectedProfilePreviewUrl = '';
  let currentProfileImageUrl = '';

  function setProfilePreview(url){
    profilePreview.src = url || 'logo.png';
    profileRemove.style.display = currentProfileImageUrl ? '' : 'none';
  }

  document.getElementById('mp-profile-select').addEventListener('click', ()=>profileFile.click());
  profileFile.addEventListener('change', ()=>{
    const file = profileFile.files && profileFile.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/') || file.size > 5 * 1024 * 1024){
      selectedProfileFile = null;
      profileSave.disabled = true;
      setProfilePreview(currentProfileImageUrl);
      profileMsg.textContent = '5MB 이하의 이미지 파일을 선택해주세요.';
      profileMsg.className = 'mp-msg err';
      profileFile.value = '';
      return;
    }
    if(selectedProfilePreviewUrl) URL.revokeObjectURL(selectedProfilePreviewUrl);
    selectedProfileFile = file;
    selectedProfilePreviewUrl = URL.createObjectURL(file);
    profilePreview.src = selectedProfilePreviewUrl;
    profileSave.disabled = false;
    profileMsg.textContent = file.name + ' · 저장을 눌러 적용해주세요.';
    profileMsg.className = 'mp-profile-hint';
  });

  async function uploadProfileImage(file){
    const signature = await window.GwakuriAuth.call('getUploadSignature', { purpose:'profile' });
    if(!signature || !signature.success) throw new Error(signature && signature.message || '업로드 권한을 확인하지 못했어요.');
    const form = new FormData();
    form.append('file', file);
    form.append('api_key', signature.apiKey);
    form.append('timestamp', signature.timestamp);
    form.append('folder', signature.folder);
    form.append('public_id', signature.publicId);
    form.append('overwrite', String(signature.overwrite));
    form.append('signature', signature.signature);
    const response = await fetch(`https://api.cloudinary.com/v1_1/${signature.cloud}/image/upload`, {
      method:'POST', body:form
    });
    const data = await response.json();
    if(!response.ok || !data.secure_url) throw new Error(data.error && data.error.message || '프로필 사진 업로드에 실패했어요.');
    return data.secure_url;
  }

  profileSave.addEventListener('click', async ()=>{
    if(!selectedProfileFile) return;
    profileSave.disabled = true;
    profileMsg.textContent = '사진을 업로드하는 중...';
    profileMsg.className = 'mp-profile-hint';
    try{
      const profileImageUrl = await uploadProfileImage(selectedProfileFile);
      const result = await window.GwakuriAuth.call('saveProfileImage', { profileImageUrl });
      if(!result.success) throw new Error(result.message || '프로필을 저장하지 못했어요.');
      currentProfileImageUrl = result.profileImageUrl || '';
      selectedProfileFile = null;
      if(selectedProfilePreviewUrl) URL.revokeObjectURL(selectedProfilePreviewUrl);
      selectedProfilePreviewUrl = '';
      profileFile.value = '';
      profileSave.disabled = true;
      const currentSession = window.GwakuriAuth.getSession();
      currentSession.profileImageUrl = currentProfileImageUrl;
      currentSession.profileLoaded = true;
      window.GwakuriAuth.setSession(currentSession);
      setProfilePreview(currentProfileImageUrl);
      const navProfile = document.getElementById('bw-nav-profile');
      if(navProfile) navProfile.innerHTML = `<img src="${escAttr(currentProfileImageUrl)}" alt="프로필"/>`;
      profileMsg.textContent = '프로필 사진을 저장했어요.';
      profileMsg.className = 'mp-msg ok';
    }catch(error){
      profileMsg.textContent = error.message || '프로필 사진을 저장하지 못했어요.';
      profileMsg.className = 'mp-msg err';
      profileSave.disabled = false;
    }
  });

  profileRemove.addEventListener('click', async ()=>{
    profileRemove.disabled = true;
    try{
      const result = await window.GwakuriAuth.call('saveProfileImage', { profileImageUrl:'' });
      if(!result.success) throw new Error(result.message || '프로필 사진을 삭제하지 못했어요.');
      currentProfileImageUrl = '';
      selectedProfileFile = null;
      if(selectedProfilePreviewUrl) URL.revokeObjectURL(selectedProfilePreviewUrl);
      selectedProfilePreviewUrl = '';
      profileFile.value = '';
      profileSave.disabled = true;
      const currentSession = window.GwakuriAuth.getSession();
      currentSession.profileImageUrl = '';
      currentSession.profileLoaded = true;
      window.GwakuriAuth.setSession(currentSession);
      setProfilePreview('');
      const navProfile = document.getElementById('bw-nav-profile');
      if(navProfile) navProfile.textContent = String(session.username || '?').trim().slice(0, 1) || '?';
      profileMsg.textContent = '프로필 사진을 삭제했어요.';
      profileMsg.className = 'mp-msg ok';
    }catch(error){
      profileMsg.textContent = error.message || '프로필 사진을 삭제하지 못했어요.';
      profileMsg.className = 'mp-msg err';
    }
    profileRemove.disabled = false;
  });

  async function loadInfo(){
    try{
      const r = await window.GwakuriAuth.call('getMyInfo', { username: session.username });
      if(!r.success){ infoBox.innerHTML = '<div class="mp-empty">정보를 불러오지 못했어요.</div>'; return; }
      currentProfileImageUrl = r.profileImageUrl || '';
      setProfilePreview(currentProfileImageUrl);
      studentIdPanel.hidden = r.role === 'teacher';
      studentIdInput.value = r.studentId || '';
      studentIdSave.textContent = r.studentId ? '학번 변경' : '학번 등록';
      const rb = r.role==='admin' ? '<span class="mp-badge mp-badge-admin">관리자</span>'
        : r.role==='manager' ? '<span class="mp-badge mp-badge-manager">매니저</span>'
        : r.role==='teacher' ? '<span class="mp-badge mp-badge-manager">선생님</span>'
        : '<span class="mp-badge mp-badge-user">일반</span>';
      const mb = r.muted ? '<span class="mp-badge mp-badge-muted">작성 금지됨</span>' : '';
      infoBox.innerHTML = `
        <div class="mp-info-row"><span>아이디</span><b>${escH(r.username)}</b></div>
        <div class="mp-info-row"><span>학번 / 학급</span><b>${escH(r.studentId || '미등록')}</b></div>
        <div class="mp-info-row"><span>이메일</span><b>${escH(r.email || '미등록')}</b></div>
        <div class="mp-info-row"><span>권한</span><span>${rb}${mb}</span></div>
        <div class="mp-info-row"><span>작성한 글</span><b>${r.postCount}개</b></div>
        <div class="mp-info-row"><span>댓글</span><b>${r.commentCount}개</b></div>`;
    }catch(e){
      infoBox.innerHTML = '<div class="mp-empty">정보를 불러오지 못했어요.</div>';
    }
  }

  studentIdForm.addEventListener('submit', async event=>{
    event.preventDefault();
    studentIdSave.disabled = true;
    studentIdMsg.textContent = '학번을 저장하는 중...';
    studentIdMsg.className = 'mp-msg';
    try{
      const result = await window.GwakuriAuth.call('updateStudentId', {
        studentId: studentIdInput.value.trim()
      });
      if(!result.success) throw new Error(result.message || '학번을 저장하지 못했어요.');
      studentIdInput.value = result.studentId;
      studentIdSave.textContent = '학번 변경';
      studentIdMsg.textContent = '학번을 저장했어요.';
      studentIdMsg.className = 'mp-msg ok';
      const currentSession = window.GwakuriAuth.getSession();
      currentSession.studentId = result.studentId;
      window.GwakuriAuth.setSession(currentSession);
      await loadInfo();
    }catch(error){
      studentIdMsg.textContent = error.message || '학번을 저장하지 못했어요.';
      studentIdMsg.className = 'mp-msg err';
    }finally{
      studentIdSave.disabled = false;
    }
  });

  cpb.addEventListener('click', async ()=>{
    const op = opEl.value, np = npEl.value;
    if(!op || !np){ cpm.textContent='모두 입력해주세요.'; cpm.className='mp-msg err'; return; }
    cpb.disabled = true;
    cpm.textContent = '처리 중...'; cpm.className = 'mp-msg';
    try{
      const r = await window.GwakuriAuth.call('changePassword', { username: session.username, oldPassword: op, newPassword: np });
      cpm.textContent = r.message || (r.success ? '완료' : '실패');
      cpm.className = r.success ? 'mp-msg ok' : 'mp-msg err';
      if(r.success){
        opEl.value=''; npEl.value='';
        // 비밀번호를 바꾸면 이전 로그인 토큰은 무효가 되고, 이 기기엔 새 토큰이 와요
        if(r.token) window.GwakuriAuth.setSession(Object.assign({}, session, { token: r.token }));
      }
    }catch(e){
      cpm.textContent = '연결 실패. 잠시 후 다시 시도해주세요.'; cpm.className = 'mp-msg err';
    }
    cpb.disabled = false;
  });

  loadInfo();

  // ── 이메일 인증 후 변경 ──────────────────────────────────────────
  (function(){
    const emEl = document.getElementById('mp-em'), ecEl = document.getElementById('mp-ec');
    const codeRow = document.getElementById('mp-code-row');
    const sendBtn = document.getElementById('mp-send'), saveBtn = document.getElementById('mp-save');
    const msg = document.getElementById('mp-emsg');
    let proof = '', proofEmail = '';
    function say(t, cls){ msg.textContent = t; msg.className = 'mp-msg' + (cls ? ' ' + cls : ''); }
    emEl.addEventListener('input', ()=>{ if(emEl.value.trim().toLowerCase() !== proofEmail){ proof=''; proofEmail=''; } });
    sendBtn.addEventListener('click', async ()=>{
      const email = emEl.value.trim();
      if(!email){ say('새 이메일을 입력해주세요.', 'err'); return; }
      sendBtn.disabled = true; say('인증번호를 보내는 중...');
      try{
        const r = await window.GwakuriAuth.call('requestEmailCode', { purpose:'update', email });
        if(r.success){ codeRow.style.display=''; saveBtn.style.display=''; say(r.message || '인증번호를 보냈어요.', 'ok'); }
        else say(r.message || '인증번호를 보내지 못했어요.', 'err');
      }catch(e){ say('연결 실패. 잠시 후 다시 시도해주세요.', 'err'); }
      sendBtn.disabled = false;
    });
    saveBtn.addEventListener('click', async ()=>{
      const email = emEl.value.trim(), code = ecEl.value.trim();
      if(code.length !== 6){ say('인증번호 6자리를 입력해주세요.', 'err'); return; }
      saveBtn.disabled = true;
      try{
        if(!proof){
          const v = await window.GwakuriAuth.call('verifyEmailCode', { purpose:'update', email, code });
          if(!v.success){ say(v.message || '인증에 실패했어요.', 'err'); saveBtn.disabled=false; return; }
          proof = v.emailProof; proofEmail = email.toLowerCase();
        }
        const r = await window.GwakuriAuth.call('updateEmail', { email, emailProof: proof });
        say(r.message || (r.success ? '이메일을 바꿨어요.' : '변경에 실패했어요.'), r.success ? 'ok' : 'err');
        if(r.success){ codeRow.style.display='none'; saveBtn.style.display='none'; emEl.value=''; ecEl.value=''; proof=''; proofEmail=''; loadInfo(); }
      }catch(e){ say('연결 실패. 잠시 후 다시 시도해주세요.', 'err'); }
      saveBtn.disabled = false;
    });
  })();

})();
</script>
</body>
</html>
