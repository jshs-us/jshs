<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>html{visibility:hidden}</style>
<title>마이페이지 — 1-3반</title>
<style>
.mp-panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:28px;margin-bottom:16px;
}
.mp-panel-title{font-size:18px;font-weight:800;margin:0 0 18px;color:var(--navy2);}
.mp-info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;}
.mp-info-row:last-child{border-bottom:none;}
.mp-info-row span:first-child{color:var(--muted);}
.mp-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:700;}
.mp-badge-admin{background:#fde3e3;color:#b3432b;}
.mp-badge-manager{background:#e3edfd;color:#1a56b3;}
.mp-badge-user{background:#eef1f8;color:var(--muted);}
.mp-badge-muted{background:#f3e3fd;color:#7b2fb3;margin-left:6px;}
.mp-row{margin-bottom:14px;}
.mp-row input{
  font-family:var(--ff);width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:13px 15px;font-size:15px;background:#fbfcfe;color:var(--ink);
}
.mp-row input:focus{outline:none;border-color:var(--navy);background:#fff;}
.mp-btn{
  font-family:var(--ff);cursor:pointer;border:none;border-radius:10px;
  padding:12px 22px;font-size:14.5px;font-weight:700;
  background:var(--yellow);color:var(--navy2);transition:.15s;
}
.mp-btn:hover{filter:brightness(.96);}
.mp-btn:disabled{opacity:.6;cursor:default;}
.mp-msg{font-size:14px;margin-top:12px;min-height:18px;}
.mp-msg.err{color:#c23b3b;}
.mp-msg.ok{color:#1f8a5c;}
.mp-loading,.mp-empty{text-align:center;padding:40px 0;color:var(--muted);}

.mp-post-list{list-style:none;}
.mp-post-item{padding:14px 0;border-bottom:1px solid var(--line);}
.mp-post-item:last-child{border-bottom:none;}
.mp-post-title{font-weight:700;font-size:15px;margin-bottom:4px;}
.mp-post-meta{font-size:13px;color:var(--muted);display:flex;gap:10px;margin-bottom:8px;}
.mp-scroll{overflow-x:auto;}
.mp-table{width:100%;border-collapse:collapse;font-size:14px;}
.mp-table th,.mp-table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
.mp-table th{color:var(--muted);font-weight:600;font-size:13px;}
.mp-user-actions{display:flex;gap:6px;flex-wrap:wrap;}
.mp-ghost-btn{
  font-family:var(--ff);cursor:pointer;border-radius:8px;padding:6px 10px;
  font-size:12.5px;font-weight:600;background:#fff;color:var(--ink);
  border:1px solid var(--line);
}
.mp-ghost-btn:hover{border-color:var(--navy);}
.mp-danger-btn{color:#c23b3b!important;border-color:#f0c8c8!important;}
.mp-role-select{
  font-family:var(--ff);font-size:12.5px;padding:6px 8px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
}
</style>
</head>
<body>
<div class="bw-page">
  <h1 class="bw-page-title">👤 마이페이지</h1>
  <p class="bw-page-sub">내 계정 정보를 확인하고 비밀번호를 변경할 수 있어요.</p>

  <div class="mp-panel">
    <p class="mp-panel-title">내 정보</p>
    <div id="mp-info"><div class="mp-loading">불러오는 중...</div></div>
  </div>

  <div class="mp-panel">
    <p class="mp-panel-title">비밀번호 변경</p>
    <div class="mp-row"><input id="mp-op" type="password" placeholder="현재 비밀번호" autocomplete="current-password"/></div>
    <div class="mp-row"><input id="mp-np" type="password" placeholder="새 비밀번호" autocomplete="new-password"/></div>
    <button class="mp-btn" id="mp-cpb">변경하기</button>
    <div class="mp-msg" id="mp-cpm"></div>
  </div>

  <div class="mp-panel" id="mp-managepost-panel" style="display:none">
    <p class="mp-panel-title">게시글 관리</p>
    <div id="mp-managepost"><div class="mp-loading">불러오는 중...</div></div>
  </div>

  <div class="mp-panel" id="mp-manageuser-panel" style="display:none">
    <p class="mp-panel-title">회원 관리</p>
    <div class="mp-scroll"><div id="mp-manageuser"><div class="mp-loading">불러오는 중...</div></div></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function(){
  function escH(s){ const d=document.createElement('div'); d.textContent=String(s??''); return d.innerHTML; }

  const session = window.GwakuriAuth && window.GwakuriAuth.getSession();
  if(!session){
    // common.js가 로그인 게이트를 이미 띄우고 있으므로 여기서는 더 진행하지 않음
    return;
  }

  const infoBox = document.getElementById('mp-info');
  const cpb = document.getElementById('mp-cpb');
  const cpm = document.getElementById('mp-cpm');
  const opEl = document.getElementById('mp-op');
  const npEl = document.getElementById('mp-np');

  async function loadInfo(){
    try{
      const r = await window.GwakuriAuth.call('getMyInfo', { username: session.username });
      if(!r.success){ infoBox.innerHTML = '<div class="mp-empty">정보를 불러오지 못했어요.</div>'; return; }
      const rb = r.role==='admin' ? '<span class="mp-badge mp-badge-admin">관리자</span>'
        : r.role==='manager' ? '<span class="mp-badge mp-badge-manager">매니저</span>'
        : '<span class="mp-badge mp-badge-user">일반</span>';
      const mb = r.muted ? '<span class="mp-badge mp-badge-muted">작성 금지됨</span>' : '';
      infoBox.innerHTML = `
        <div class="mp-info-row"><span>이름</span><b>${escH(r.username)}</b></div>
        <div class="mp-info-row"><span>권한</span><span>${rb}${mb}</span></div>
        <div class="mp-info-row"><span>작성한 글</span><b>${r.postCount}개</b></div>
        <div class="mp-info-row"><span>댓글</span><b>${r.commentCount}개</b></div>`;
    }catch(e){
      infoBox.innerHTML = '<div class="mp-empty">정보를 불러오지 못했어요.</div>';
    }
  }

  cpb.addEventListener('click', async ()=>{
    const op = opEl.value, np = npEl.value;
    if(!op || !np){ cpm.textContent='모두 입력해주세요.'; cpm.className='mp-msg err'; return; }
    cpb.disabled = true;
    cpm.textContent = '처리 중...'; cpm.className = 'mp-msg';
    try{
      const r = await window.GwakuriAuth.call('changePassword', { username: session.username, oldPassword: op, newPassword: np });
      cpm.textContent = r.message || (r.success ? '완료' : '실패');
      cpm.className = r.success ? 'mp-msg ok' : 'mp-msg err';
      if(r.success){ opEl.value=''; npEl.value=''; }
    }catch(e){
      cpm.textContent = '연결 실패. 잠시 후 다시 시도해주세요.'; cpm.className = 'mp-msg err';
    }
    cpb.disabled = false;
  });

  loadInfo();

  // ── 관리자/매니저 전용: 게시글·회원 관리 ──────────────────────────
  const isManager = session.role === 'admin' || session.role === 'manager';
  const isAdmin = session.role === 'admin';

  function fmtD(v){ const d = new Date(v); return isNaN(d) ? '' : `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }

  if(isManager){
    document.getElementById('mp-managepost-panel').style.display = '';
    loadManagePosts();
  }
  if(isAdmin){
    document.getElementById('mp-manageuser-panel').style.display = '';
    loadManageUsers();
  }

  async function loadManagePosts(){
    const b = document.getElementById('mp-managepost');
    try{
      const r = await window.GwakuriAuth.call('listPosts', {});
      const ps = r.success ? r.posts : [];
      if(!ps.length){ b.innerHTML = '<div class="mp-empty">게시글이 없어요.</div>'; return; }
      b.innerHTML = `<ul class="mp-post-list">${ps.map(p=>`
        <li class="mp-post-item">
          <p class="mp-post-title">${escH(p.title)}</p>
          <div class="mp-post-meta"><span>${escH(p.author)}</span><span>${fmtD(p.createdAt)}</span></div>
          <button class="mp-ghost-btn mp-danger-btn" data-dp="${p.id}">삭제</button>
        </li>`).join('')}</ul>`;
      b.querySelectorAll('[data-dp]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('삭제할까요?')) return;
          const r = await window.GwakuriAuth.call('adminDeletePost', { id: btn.dataset.dp, actor: session.username });
          if(r.success) loadManagePosts(); else alert(r.message || '삭제 실패');
        };
      });
    }catch(e){ b.innerHTML = '<div class="mp-empty">불러오지 못했어요.</div>'; }
  }

  async function loadManageUsers(){
    const b = document.getElementById('mp-manageuser');
    try{
      const r = await window.GwakuriAuth.call('listUsers', { actor: session.username });
      if(!r.success){ b.innerHTML = `<div class="mp-empty">${escH(r.message || '불러오지 못했어요.')}</div>`; return; }
      b.innerHTML = `<table class="mp-table"><thead><tr>
          <th>이름</th><th>가입일</th><th>권한</th><th>상태</th><th>관리</th>
        </tr></thead><tbody>${r.users.map(u=>`
          <tr>
            <td>${escH(u.username)}${u.isFounder?' <span class="mp-badge mp-badge-admin">최초</span>':''}</td>
            <td>${fmtD(u.createdAt)}</td>
            <td>${u.isFounder
              ? '<span class="mp-badge mp-badge-admin">관리자</span>'
              : `<select class="mp-role-select" data-u="${escH(u.username)}">
                   <option value="user"${u.role==='user'?' selected':''}>일반</option>
                   <option value="manager"${u.role==='manager'?' selected':''}>매니저</option>
                   <option value="admin"${u.role==='admin'?' selected':''}>관리자</option>
                 </select>`}</td>
            <td>${u.muted ? '<span class="mp-badge mp-badge-muted">작성금지</span>' : '-'}</td>
            <td><div class="mp-user-actions">${u.isFounder ? '' : `
              <button class="mp-ghost-btn" data-mute="${escH(u.username)}" data-cur="${u.muted?1:0}">${u.muted?'금지해제':'작성금지'}</button>
              <button class="mp-ghost-btn" data-rst="${escH(u.username)}">비번초기화</button>
              <button class="mp-ghost-btn mp-danger-btn" data-kick="${escH(u.username)}">강제탈퇴</button>`}</div></td>
          </tr>`).join('')}</tbody></table>`;

      b.querySelectorAll('.mp-role-select').forEach(s=>{
        s.onchange = async ()=>{
          const r = await window.GwakuriAuth.call('setRole', { actor: session.username, targetUsername: s.dataset.u, newRole: s.value });
          if(!r.success){ alert(r.message || '실패'); loadManageUsers(); }
        };
      });
      b.querySelectorAll('[data-mute]').forEach(btn=>{
        btn.onclick = async ()=>{
          const r = await window.GwakuriAuth.call('setMuted', { actor: session.username, targetUsername: btn.dataset.mute, muted: String(btn.dataset.cur==='0') });
          if(r.success) loadManageUsers(); else alert(r.message || '실패');
        };
      });
      b.querySelectorAll('[data-rst]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm(btn.dataset.rst + '님 비밀번호를 0000으로 초기화?')) return;
          const r = await window.GwakuriAuth.call('resetPassword', { actor: session.username, targetUsername: btn.dataset.rst });
          alert(r.message || (r.success ? '완료' : '실패'));
        };
      });
      b.querySelectorAll('[data-kick]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm(btn.dataset.kick + '님을 강제 탈퇴시킬까요?')) return;
          const r = await window.GwakuriAuth.call('kickUser', { actor: session.username, targetUsername: btn.dataset.kick });
          if(r.success) loadManageUsers(); else alert(r.message || '실패');
        };
      });
    }catch(e){ b.innerHTML = '<div class="mp-empty">불러오지 못했어요.</div>'; }
  }
})();
</script>
</body>
</html>
