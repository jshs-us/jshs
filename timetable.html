<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<style>html{visibility:hidden}</style>
<title>시간표 — 1-3반</title>
<style>
.tt-wrap{overflow-x:auto;}
table.tt-table{
  width:100%;border-collapse:collapse;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  overflow:hidden;
  font-size:14px;
  min-width:460px;
}
.tt-table th{
  background:var(--navy2);color:#fff;
  font-size:13px;font-weight:700;
  padding:12px 10px;text-align:center;
}
.tt-table td{
  padding:14px 10px;
  border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);
  text-align:center;
  vertical-align:middle;
  font-weight:600;
}
.tt-table td:first-child{
  background:var(--paper);
  color:var(--muted);font-weight:700;font-size:13px;
  width:48px;
}
.tt-table tr:last-child td{border-bottom:none;}
.tt-table th:last-child,.tt-table td:last-child{border-right:none;}
.tt-today{
  background:rgba(255,236,0,.18) !important;
  color:var(--navy2) !important;
}
.tt-table th.today-col{
  background:var(--navy);
}
.tt-cell-inner{font-size:14px;}
.tt-loading{text-align:center;padding:60px 0;color:var(--muted);}
.tt-empty{text-align:center;padding:60px 0;color:var(--muted);font-size:15px;}
</style>
</head>
<body>
<div class="bw-page">
  <h1 class="bw-page-title">📅 시간표</h1>
  <p class="bw-page-sub" id="tt-sub">스프레드시트에서 실시간으로 불러옵니다.</p>

  <div class="tt-wrap">
    <div id="tt-wrap"><div class="tt-loading">불러오는 중...</div></div>
  </div>

  <p style="margin-top:20px;font-size:13px;color:var(--muted);">
    ※ 시간표 수정은
    <a href="https://docs.google.com/spreadsheets/d/1lIaO9t4V62HTBGGSMj9Ormm-GgEhgyqnXIV2ryCV5Yo/edit" target="_blank"
       style="color:var(--navy);font-weight:700;">스프레드시트</a>에서 직접 해주세요.
  </p>
</div>

<script src="native-bridge.js"></script>
<script src="common.js"></script>
<script>
const SHEET_ID = "1lIaO9t4V62HTBGGSMj9Ormm-GgEhgyqnXIV2ryCV5Yo";
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

function esc(s){ const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML; }

// 오늘 요일 (0=일,1=월,...,6=토) → 컬럼 인덱스 (월=1,화=2,...금=5)
const todayDow = new Date().getDay();

fetch(URL)
  .then(r=>r.text())
  .then(raw=>{
    const json = JSON.parse(raw.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
    const table = json.table;
    const colLabels = table.cols.map(c=>c.label||'');
    const rows = table.rows;

    if(!rows.length){
      document.getElementById('tt-wrap').innerHTML='<div class="tt-empty">시간표가 없어요.</div>';
      return;
    }

    // 첫 번째 행이 헤더인지 판단
    // 스프레드시트 구조: A열=교시, B~F열=월~금 (또는 헤더행 포함)
    const firstRow = rows[0].c?.map(c=>c?.v??'') || [];
    let headerRow, dataRows;
    if(typeof firstRow[1]==='string' && isNaN(firstRow[1])){
      headerRow = firstRow;
      dataRows = rows.slice(1);
    } else {
      headerRow = ['교시','월','화','수','목','금'];
      dataRows = rows;
    }

    // 오늘 컬럼: 월=1,화=2,...금=5 → headerRow 인덱스
    const dowNames = ['일','월','화','수','목','금','토'];
    const todayName = dowNames[todayDow];
    const todayColIdx = headerRow.indexOf(todayName);

    document.getElementById('tt-sub').textContent =
      `오늘은 ${todayName}요일입니다. 노란색 열이 오늘 시간표예요.`;

    const thead = `<thead><tr>${headerRow.map((h,i)=>`
      <th class="${i===todayColIdx?'today-col':''}">${esc(h)}</th>
    `).join('')}</tr></thead>`;

    const tbody = `<tbody>${dataRows.map(r=>{
      const cells = r.c||[];
      return `<tr>${cells.map((c,i)=>{
        const v = c?.v ?? '';
        return `<td class="${i===todayColIdx&&i>0?'tt-today':''}"><span class="tt-cell-inner">${esc(v)}</span></td>`;
      }).join('')}</tr>`;
    }).join('')}</tbody>`;

    document.getElementById('tt-wrap').innerHTML = `
      <table class="tt-table">${thead}${tbody}</table>`;
  })
  .catch(()=>{
    document.getElementById('tt-wrap').innerHTML='<div class="tt-empty">스프레드시트를 불러오지 못했어요.<br>공유 설정을 확인해주세요.</div>';
  });
</script>
</body>
</html>
